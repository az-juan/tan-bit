services:
  web:
    build: ./api
    container-name: tan-bit-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=XYZ
      - DB_NAME=tan_bit
    depends_on:
      - database
    volumes:
      - ./api:/app

database:
  image: postgres:15
  container-name: tan-bit-pg
  environment:
    - POSTGRES_DB=${PG_DB_NAME}
    - POSTGRES_USER=azjuan
    - POSTGRES_PASSWORD=${PG_PASSWD}
  ports:
    - "5432:5432"
  volumes:
    - postgres_data:/var/lib/postgresql/data

volumes:
  pgdata:
    
