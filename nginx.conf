# /etc/nginx/conf.d/uploads.conf  (o dentro del server block)

server {
    listen 80;
    server_name _;

    # API Go (proxy)
    location /api/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 10M;  # tamaño máx del upload
    }

    # Imágenes estáticas
    location /uploads/ {
        alias /app/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Opcional: solo GET/HEAD
        limit_except GET HEAD {
            deny all;
        }
    }
}   
