services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8080:8080"
    volumes:
      # Montar todo el proyecto
      - .:/app
      # Cachea paquetes instalados
      - go-mod-cache:/go/pkg/mod
      # Cachea builds
      - go-build-cache:/root/.cache/go-build
      # evita que tmp se sincronize con el codigo local para evitar conflictos
      - /app/tmp
    env_file:
      - path: ./example.env
        required: true
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${PG_USER}
      - DB_PASSWORD=${PG_PASSWD}
      - DB_NAME=${DB_NAME}
      - DATABASE_URL=${DB_URL}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - broker-net
      # - api-net
  database:
    image: postgres:15-alpine
    container_name: pg
    env_file:
      - path: ./example.env
        required: true
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - db-net
  broker:
    image: nats:2.15-alpine
    container_name: broker
    env_file:
      - path: ./example.env
        required: true
    ports:
      - 4222:4222
      - 8222:8222
      - 6222:6222
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - broker-net
    
volumes:
  go-mod-cache:
    driver: local
  go-build-cache:
    driver: local
  pgdata:
    driver: local

networks:
  # api-net:
    # driver: bridge
  db-net:
    driver: bridge
  broker-net:
    driver: bridge
