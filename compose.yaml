services:
  api:
    build: .                            ##Construir imagen usando el Dockerfile de ./
    container_name: tan-bit-api
    ports:
      - "8080:8080"                     ##[puerto_anfitrion:puerto_contenedor]
    environment:                        ##Pasa variables de entorno al contenedor para poder conectarse a la db
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:                         ##Primero q arranque database
        database:
            condition: service_healthy

    ##volumes:                            No quiero q el contenedor tenga acceso a
    ##  - .:/app                          otros archivos ademas de lo que indico en Dockerfile
  database:
    image: postgres:15                  ##Imagen oficial
    container_name: tan-bit-pg
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

    ports:
      - "5433:5432"
    volumes:
      ##Volumen persitente donde la bd queda guardada aunque apague el contenedor
      - pgdata:/var/lib/postgresql/data
      ##Primera vez q se crea el contenedor se crean las tablas. Si modifico las tablas,
      ##no se reflejan los cambios
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ##Evita raceconditions entre contenedores, primero inicia database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  pgdata:
