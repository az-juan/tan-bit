services:
  api:
    build: .
    container_name: tan-bit-api
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=tan_bit
    depends_on:
      - database
    volumes:
      - .:/app
  database:
    image: postgres:15
    container_name: tan-bit-pg
    environment:
      - POSTGRES_DB=tan_bit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    
