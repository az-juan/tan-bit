services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    ports:
      - "8080:8080"            #[puerto_anfitrion:puerto_contenedor]
    volumes:
      # Contenedor sincronizado con filesystem de la maquina anfitriona
      - .:/app
      # Cachea paquetes instalados
      - go-mod-cache:/go/pkg/mod
      # Cachea builds
      - go-build-cache:/root/.cache/go-build
      # Evita que tmp se sincronize con el codigo local para evitar conflictos
      - /app/tmp
    env_file:
      - path: ./example.env
        required: true
    environment:
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=${PG_USER}
      - DB_PASSWORD=${PG_PASSWD}
      - DB_NAME=${DB_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:15-alpine
    container_name: pg
    env_file:
      - path: ./example.env
        required: true
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWD}
    volumes:
    ##Volumen persitente donde la bd queda guardada aunque apague el contenedor
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    ##Evita raceconditions entre contenedores, primero inicia database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  go-mod-cache:
  go-build-cache:
  pgdata:
