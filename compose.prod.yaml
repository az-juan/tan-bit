services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: api
    ports:
      - "8080:8080"            #[puerto_anfitrion:puerto_contenedor]
    ##env_file carga sus variables al contenedor en tiempo de ejecucion
    env_file:
      - path: ./example.env
        required: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 3s  ##Binario compilado arranca rapido
    ##Evita raceconditions entre contenedores, primero inicia database
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:15-alpine
    container_name: pg
    ##Environment carga esas variables al contenedor (interpoladas con --env-file)
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
    ##Volumen persitente donde la bd queda guardada aunque apague el contenedor
      - pgdata:/var/lib/postgresql/data
    ##Se ejecuta solo la primera vez (db vacía)
      - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
    ##Solo loopback: el anfitrion corre go test, pero la db no queda expuesta a la red
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
